apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itsaam/hatch.git
    targetRevision: main
    path: deploy/kubernetes/overlays/example
  destination:
    server: https://kubernetes.default.svc
    namespace: hatch-system
