apiVersion: v1
kind: Service
metadata:
  name: hatch-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: hatch-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hatch-postgres
spec:
  serviceName: hatch-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hatch-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hatch-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: hatch-postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hatch-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hatch-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hatch-api
      ports:
        - protocol: TCP
          port: 5432
