apiVersion: v1
kind: ServiceAccount
metadata:
  name: hatch-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatch-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hatch-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hatch-api
    spec:
      serviceAccountName: hatch-api
      terminationGracePeriodSeconds: 100
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/itsaam/hatch-api:edge
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hatch-api-config
            - secretRef:
                name: hatch-api-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: github-app
              mountPath: /var/run/hatch/github
              readOnly: true
            - name: buildkit-tls
              mountPath: /var/run/hatch/buildkit
              readOnly: true
            - name: registry-config
              mountPath: /var/run/hatch/registry
              readOnly: true
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: github-app
          secret:
            secretName: hatch-github-app
            optional: true
            defaultMode: 0440
        - name: buildkit-tls
          secret:
            secretName: hatch-buildkit-tls
            defaultMode: 0440
            items:
              - key: ca.pem
                path: ca.pem
              - key: cert.pem
                path: cert.pem
              - key: key.pem
                path: key.pem
        - name: registry-config
          secret:
            secretName: hatch-registry-config
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: hatch-api
spec:
  selector:
    app.kubernetes.io/name: hatch-api
  ports:
    - name: http
      port: 8080
      targetPort: http
