apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatch-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hatch-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hatch-landing
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/itsaam/hatch-landing:edge
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: hatch-landing
spec:
  selector:
    app.kubernetes.io/name: hatch-landing
  ports:
    - name: http
      port: 80
      targetPort: http
