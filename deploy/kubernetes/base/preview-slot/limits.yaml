apiVersion: v1
kind: ResourceQuota
metadata:
  name: hatch-preview
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    pods: "24"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    count/configmaps: "32"
    count/secrets: "32"
    services: "24"
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/deployments.apps: "24"
    count/jobs.batch: "16"
    count/ingresses.networking.k8s.io: "16"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hatch-preview
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 1Gi
