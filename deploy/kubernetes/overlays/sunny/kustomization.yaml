apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - api-ingress-policy.yaml
configMapGenerator:
  - name: hatch-api-config
    namespace: hatch-system
    behavior: merge
    literals:
      - ALLOWED_ORIGIN=https://hatchpr.dev
      - HATCH_PUBLIC_API_URL=https://api.hatchpr.dev
      - HATCH_DOMAIN=hatchpr.dev
      - HATCH_ALLOWED_OWNERS=itsaam
      - HATCH_TRUSTED_PROXY_CIDRS=10.42.0.0/24,10.254.251.2/32
      - HATCH_REGISTRY_PREFIX=ghcr.io/itsaam/hatch-previews
      - HATCH_KUBE_INGRESS_CLASS=traefik-kubernetes
      - HATCH_KUBE_IMAGE_PULL_SECRET=hatch-preview-pull
patches:
  - target:
      kind: Ingress
      name: hatch-public
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik-kubernetes
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: api.hatchpr.dev
      - op: replace
        path: /spec/rules/1/host
        value: hatchpr.dev
  - target:
      kind: NetworkPolicy
      name: hatch-preview
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/1
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kubernetes-ingress-system
